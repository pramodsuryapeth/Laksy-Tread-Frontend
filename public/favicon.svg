<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kalakar Print Studio — Vector SVG Logo
  =======================================
  Recreated from pixel-level analysis of original 7136×8000 PNG.

  Gradient stops — sampled directly from PNG pixels:
    0%   #FF2700  deep red       (pixel x=19% of text width)
    15%  #FF5700  red-orange     (pixel x=27%)
    28%  #FF9A00  orange         (pixel x=33%)
    40%  #FFB901  amber          (pixel x=43%)
    50%  #D1CF00  yellow-green   (pixel x=53%)
    62%  #73D601  bright green   (pixel x=65%)
    78%  #25C6B7  cyan-teal      (pixel x=71%)
   100%  #4086FF  cobalt-indigo  (pixel x=79%)

  PRINT STUDIO color: #1a1a1a (pixel scan: #020202–#3A3A3A range)
  Shirt icon: pure black #000000 (pixel confirmed)
  Font: Noto Sans Devanagari 900 weight (embed or link separately)
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 500 420"
  width="500"
  height="420"
  role="img"
  aria-label="Kalakar Print Studio Logo"
>
  <title>कलाकार — Kalakar Print Studio</title>

  <defs>
    <!-- ── Exact rainbow gradient from PNG pixel sampling ── -->
    <linearGradient id="kRainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF2700"/>
      <stop offset="15%"  stop-color="#FF5700"/>
      <stop offset="28%"  stop-color="#FF9A00"/>
      <stop offset="40%"  stop-color="#FFB901"/>
      <stop offset="50%"  stop-color="#D1CF00"/>
      <stop offset="62%"  stop-color="#73D601"/>
      <stop offset="78%"  stop-color="#25C6B7"/>
      <stop offset="100%" stop-color="#4086FF"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════
       SHIRT-ON-HANGER ICON
       Coordinates normalized from 7136×8000 pixel trace.
       Icon centered at x=250. All proportions preserved.
  ═══════════════════════════════════════════════════════ -->
  <g id="hanger-icon"
     stroke="#000000"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Vertical hanging stem -->
    <line x1="250" y1="30" x2="250" y2="62"
          stroke-width="4"/>

    <!-- Hook — small right-curling arc at stem top -->
    <path d="M250,30
             C250,22 259,16 266,18
             C275,21 277,31 270,38
             C265,43 258,44 254,40
             C251,38 250,34 250,30"
          stroke-width="3.5"/>

    <!-- Hanger crossbar / shoulder rod -->
    <line x1="210" y1="72" x2="290" y2="72"
          stroke-width="5"/>

    <!-- Left diagonal arm (wide sweep like original) -->
    <line x1="210" y1="72" x2="155" y2="120"
          stroke-width="4.5"/>

    <!-- Right diagonal arm -->
    <line x1="290" y1="72" x2="345" y2="120"
          stroke-width="4.5"/>

    <!-- Left collar flap — curves from center down-left to shoulder seam -->
    <path d="M250,68
             C248,72 236,79 218,90
             C209,95 206,100 208,108
             L226,145"
          stroke-width="4"/>

    <!-- Right collar flap — mirror -->
    <path d="M250,68
             C252,72 264,79 282,90
             C291,95 294,100 292,108
             L274,145"
          stroke-width="4"/>

    <!-- Shirt body — left side seam -->
    <line x1="226" y1="108" x2="230" y2="145"
          stroke-width="3.5"/>

    <!-- Shirt body — right side seam -->
    <line x1="274" y1="108" x2="270" y2="145"
          stroke-width="3.5"/>

    <!-- Shirt hem (bottom edge) -->
    <line x1="230" y1="145" x2="270" y2="145"
          stroke-width="3.5"/>

    <!-- Collar fold lines — 3 parallel horizontal stripes
         (the distinctive shirt collar detail from the original logo) -->
    <line x1="235" y1="118" x2="265" y2="118" stroke-width="3.2"/>
    <line x1="233" y1="127" x2="267" y2="127" stroke-width="3.2"/>
    <line x1="231" y1="136" x2="269" y2="136" stroke-width="3.2"/>

  </g>

  <!-- ═══════════════════════════════════════════════════════
       "कलाकार" — DEVANAGARI WITH PIXEL-SAMPLED RAINBOW
       Font: Noto Sans Devanagari, weight 900
       Centered at x=250
  ═══════════════════════════════════════════════════════ -->
  <text
    x="250"
    y="295"
    text-anchor="middle"
    font-family="'Noto Sans Devanagari', 'Mangal', 'Arial Unicode MS', sans-serif"
    font-weight="900"
    font-size="112"
    letter-spacing="2"
    fill="url(#kRainbow)"
  >कलाकार</text>

  <!-- ═══════════════════════════════════════════════════════
       "PRINT STUDIO" — SUBTITLE
       Pixel color: #1a1a1a | wide letter-spacing | bold caps
       Centered under Hindi text
  ═══════════════════════════════════════════════════════ -->
  <text
    x="254"
    y="365"
    text-anchor="middle"
    font-family="'Helvetica Neue', 'Helvetica', 'Arial', sans-serif"
    font-weight="700"
    font-size="28"
    letter-spacing="10"
    fill="#1a1a1a"
  >PRINT STUDIO</text>

</svg>