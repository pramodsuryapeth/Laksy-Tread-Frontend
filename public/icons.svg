<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560" role="img">
  <title>Kalakar Print Studio</title>
  <desc>Kalakar Print Studio logo with shirt hanger icon and rainbow Devanagari text</desc>

  <defs>
    <!-- Rainbow gradient for Devanagari text: red → orange → yellow → green → blue/purple -->
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F52B00"/>
      <stop offset="18%"  stop-color="#FF6B00"/>
      <stop offset="36%"  stop-color="#FFD200"/>
      <stop offset="54%"  stop-color="#7ED321"/>
      <stop offset="72%"  stop-color="#00C853"/>
      <stop offset="86%"  stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════
       SHIRT HANGER ICON (top center)
       Hanger hook + triangle body + shirt collar
  ═══════════════════════════════════════════════ -->

  <!-- Hanger hook (small hook at top) -->
  <path d="M250 58 C250 46, 260 40, 268 44 C276 48, 276 58, 268 62"
        fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Main hanger bar (triangle shape) -->
  <!-- Left arm -->
  <line x1="250" y1="62" x2="108" y2="148" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="250" y1="62" x2="392" y2="148" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Shirt collar - left side (folded lapel shape) -->
  <!-- Left collar fold -->
  <path d="M182 110 Q210 98, 234 106 Q240 118, 250 130 Q238 122, 218 118 Q198 120, 182 110Z"
        fill="#1a1a1a" stroke="none"/>
  <!-- Right collar fold -->
  <path d="M318 110 Q290 98, 266 106 Q260 118, 250 130 Q262 122, 282 118 Q302 120, 318 110Z"
        fill="#1a1a1a" stroke="none"/>

  <!-- Collar stripes (shirt lines on the collar) -->
  <!-- Left collar stripes -->
  <line x1="200" y1="104" x2="246" y2="130" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="208" y1="99"  x2="248" y2="122" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="218" y1="95"  x2="250" y2="115" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Right collar stripes -->
  <line x1="300" y1="104" x2="254" y2="130" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="292" y1="99"  x2="252" y2="122" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="282" y1="95"  x2="250" y2="115" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- ═══════════════════════════════════════════════
       DEVANAGARI TEXT  "कलाकार"
       Rendered as SVG text with rainbow gradient
       Font: a rounded Devanagari display face
  ═══════════════════════════════════════════════ -->

  <text
    x="250"
    y="340"
    text-anchor="middle"
    font-family="'Noto Sans Devanagari', 'Hind', 'Mukta', 'Baloo 2', Arial Unicode MS, sans-serif"
    font-size="148"
    font-weight="700"
    fill="url(#rainbowGrad)"
    letter-spacing="-2"
  >कलाकार</text>

  <!-- ═══════════════════════════════════════════════
       SUBTITLE: PRINT STUDIO
  ═══════════════════════════════════════════════ -->

  <text
    x="250"
    y="398"
    text-anchor="middle"
    font-family="'Montserrat', 'Futura', 'Gill Sans', 'Century Gothic', Arial, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#1a1a1a"
    letter-spacing="8"
  >PRINT STUDIO</text>

</svg>